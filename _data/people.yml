pi:
  name: Prof. Dr. Adnan Yazıcı
  short_name: Adnan Yazıcı
  title: Professor and Chair, Department of Computer Science
  photo: ""
  email: adnan.yazici@nu.edu.kz
  links:
    - label: Google Scholar
      url: ""
    - label: LinkedIn
      url: ""
  bio: >-
    Prof. Dr. Adnan Yazıcı received his Ph.D. in Computer Science from the
    Department of Computer Science, Tulane University, Louisiana, USA, in 1991.
    He is the Chair of the Department of Computer Science in the School of
    Science and Technology, Nazarbayev University. He has published over 200
    international technical papers and co-authored or edited three books:
    *Fuzzy Database Modeling* (Springer), *Fuzzy Logic in its 50th Year: New
    Developments, Directions, and Challenges* (Springer), and *Uncertainty
    Approaches for Spatial Data Modeling and Processing: A Decision Support
    Perspective* (Springer).


    His current research interests include intelligent database systems,
    wireless multimedia sensor networks, data science, and fuzzy database
    modelling. He received the IBM Faculty Award in 2011 and the Parlar
    Foundation's Young Investigator Award in 2001. He was Conference Co-Chair
    of the 23rd IEEE International Conference on Data Engineering (2007), the
    38th International Conference on Very Large Data Bases (2012), and the 23rd
    IEEE International Conference on Fuzzy Systems (2015). He is currently an
    Associate Editor of the IEEE Transactions on Fuzzy Systems and a member of
    ACM, the IEEE Computational Intelligence Society, and the Fuzzy Systems
    Technical Committee.
  highlights:
    - figure: "200+"
      label: international papers
    - figure: "3"
      label: books with Springer
    - figure: "1991"
      label: Ph.D., Tulane University

